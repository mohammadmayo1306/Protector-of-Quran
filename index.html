<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protector of Quran</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section id="loginView" class="card login-card">
      <h1>🕌 Protector of Quran</h1>
      <p class="muted">Quran Hifz & Student Management System</p>
      <form id="loginForm">
        <label>Login ID<input id="loginId" required placeholder="مثلاً admin"></label>
        <label>Password<input id="loginPassword" type="password" required placeholder="Password"></label>
        <button type="submit">Login</button>
      </form>
      <p id="loginMsg" class="msg"></p>
      <small>Demo: admin / admin123</small>
    </section>

    <section id="dashboardView" class="hidden">
      <header class="topbar">
        <div><strong>🕌 Protector of Quran</strong><span id="welcome"></span></div>
        <button id="logoutBtn" class="secondary">Logout</button>
      </header>

      <div class="stats">
        <div class="stat"><b id="studentCount">0</b><span>Students</span></div>
        <div class="stat"><b id="recordCount">0</b><span>Records</span></div>
        <div class="stat"><b id="errorCount">0</b><span>Today Errors</span></div>
        <div class="stat"><b id="goodCount">0</b><span>Very Good</span></div>
      </div>

      <section class="card">
        <h2>📖 Daily Quran Record</h2>
        <form id="recordForm" class="grid">
          <label>Student ID<input id="studentId" required></label>
          <label>Student Name<input id="studentName" required></label>
          <label>Date<input id="recordDate" type="date" required></label>
          <label>Attendance<select id="attendance"><option>حاضر</option><option>غیر حاضر</option><option>چھٹی</option></select></label>
          <label>Teacher<input id="teacher"></label>
          <label>Sabaq<input id="sabaq"></label>
          <label>Sabqi<input id="sabqi"></label>
          <label>Manzil<input id="manzil"></label>
          <label>Mistakes<input id="mistakes" type="number" min="0" value="0"></label>
          <label>Attention<select id="attention"><option>بہت اچھی</option><option>اچھی</option><option>مزید توجہ</option></select></label>
          <label>Quality<select id="quality"><option>Very Good</option><option>Good</option><option>Need Improvement</option></select></label>
          <label>Remarks<input id="remarks"></label>
          <button type="submit">Record Save کریں</button>
        </form>
      </section>

      <section class="card">
        <h2>👨‍🎓 Student Accounts</h2>
        <form id="studentForm" class="grid">
          <label>Student Login ID<input id="newStudentId" required></label>
          <label>Student Name<input id="newStudentName" required></label>
          <label>Password<input id="newStudentPassword" required></label>
          <button type="submit">Student Add کریں</button>
        </form>
        <div class="table-wrap">
          <table><thead><tr><th>ID</th><th>Name</th><th>Password</th><th>Action</th></tr></thead>
          <tbody id="studentsTable"></tbody></table>
        </div>
      </section>

      <section class="card">
        <h2>📋 Recent Records</h2>
        <div class="table-wrap">
          <table><thead><tr><th>Date</th><th>Student</th><th>Attendance</th><th>Sabaq</th><th>Errors</th><th>Quality</th></tr></thead>
          <tbody id="recordsTable"></tbody>
        </div>
      </section>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
